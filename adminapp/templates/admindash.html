{% extends 'adminbase.html' %}
{% load static %}

{% block admin %}
<div class="container">
    <div class="row p-3" style="background-color:#0891B2;color: beige;border-radius: 24px;">
        <div class="col-12">
            <h3 class="mb-0" style="color:beige;">Galaxy Resources Panel</h3>
        </div>
    </div>
    <div class="row mt-4 g-3">
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border shadow-lg p-3 h-100" style="border-radius: 20px;">
                <h1>{{jscount}}</h1>
                <h5 class="fw-bold mb-0">Total Jobseeker</h5>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border shadow-lg p-3 h-100" style="border-radius: 20px;">
                <h1>{{enqcount}}</h1>
                <h5 class="fw-bold mb-0">Total Enquiries</h5>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border shadow-lg p-3 h-100" style="border-radius: 20px;">
                <h1>{{jobcount}}</h1>
                <h5 class="fw-bold mb-0">Total Job</h5>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border shadow-lg p-3 h-100" style="border-radius: 20px;">
                <h1>{{compcount}}</h1>
                <h5 class="fw-bold mb-0">Total Complaints</h5>
            </div>
        </div>
    </div>
    <div class="row mt-2 g-3 justify-content-center">
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border shadow-lg p-3 h-100" style="border-radius: 20px;">
                <h1>{{feedcount}}</h1>
                <h5 class="fw-bold mb-0">Total Feedback</h5>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border shadow-lg p-3 h-100" style="border-radius: 20px;">
                <h1>{{ajcount}}</h1>
                <h5 class="fw-bold mb-0">Total Applied Jobs</h5>
            </div>
        </div>
    </div>
</div>
{% endblock %}
