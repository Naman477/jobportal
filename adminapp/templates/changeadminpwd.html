{% extends 'adminbase.html' %}
{% load static %}

{% block admin %}
<div class="container py-3">
    <h2 class="p-2 rounded" style="background-color: beige; color:#0891B2;text-align: center;">Change Admin Password</h2>
    <hr>
    {% if messages %}
    {% for m in messages %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        {{m}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% endif %}
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <form method="POST" class="p-3 p-md-4 rounded border" style="background-color: beige; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; font-size:medium;">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter old Password</label>
                    <input type="password" name="oldpassword" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter New Password</label>
                    <input type="password" name="newpassword" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Enter Confirm Password</label>
                    <input type="password" name="confirmpassword" class="form-control" required>
                </div>
                <button type="submit" class="btn w-100" style="background-color: #0891B2; color: beige;">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
