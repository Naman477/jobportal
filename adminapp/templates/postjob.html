
{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="container py-3">
    <h2 class="p-2 rounded" style="color:#0891B2; background-color:beige;text-align: center;">PostJob</h2>

    {% if messages %}
    {% for m in messages %}
     <div class="alert alert-info">{{m}}</div>
    {% endfor %}
    {% endif %}
    <hr>
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <form method="post" class="p-3 p-md-4 rounded border" style="background-color: beige; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;font-size:medium;">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter Job Title</label>
                    <input type="text" name="title" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter Job Description</label>
                    <textarea name="description" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter Location</label>
                    <input type="text" name="location" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Enter Salary</label>
                    <input type="number" name="salary" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Select Job Type</label>
                    <select name="jobtype" class="form-control">
                        <option>select job </option>
                        <option>Full time</option>
                        <option>Part time</option>
                        <option>Internship</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Enter Last Date</label>
                    <input type="date" name="lastdate" class="form-control">
                </div>
                <button type="submit" class="btn w-100" style="background-color: #0891B2;color: aliceblue;">Post Job</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
