{% extends 'base.html' %}
{% load static %}

{% block main %}
<head>
    <style>
        .col-sm-12{
            background-color:beige;
            color: #0a7286;
            margin-bottom: 4vh;
            animation: flapin 0.6s ease both;
            border: 1px dashed #0a7286;
        }
         .col-sm-12{
            background-color:beige;
            color: #0a7286;
            margin-bottom: 4vh;
            background-image:linear-gradient(135deg, rgba(15, 23, 42, 0.75)0%, rgba(15, 23, 42, 0.75)),url('https://static.vecteezy.com/system/resources/thumbnails/007/067/602/small_2x/businessman-shows-outstretched-hand-with-social-icon-on-virtual-screen-contact-us-free-photo.jpg');
            border: 1px dashed beige;
            background-size: cover;
            background-position: top;
            background-repeat:no-repeat ;
            margin-left: 5px;
            animation: flapin 0.6s ease both;
            align-items: center;
            
        }

        
        @keyframes flapin {
      0% {
        transform: rotateX(120deg);
        opacity: 0;
      }

      60% {
        transform: rotateX(-10deg);
        opacity: 1;
      }

      100% {
        transform: rotateX(0deg);
      }
    }

    .col-sm-12.flap {
      animation-delay: .25s;
    }

    .col-sm-12.flap {
      animation-delay: .15s;
    }
    


    

    </style>
</head>
<h2 class="my-5" style="text-align:center; background-color: #0a7286;color: beige; font-family: Georgia,  New Roman Times, serif; ">Contact us</h2>
    {% if messages %}
        {% for m in messages %}
     <div class="alert alert-dismissible fade show" role="alert">
         {{m}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
       
        {% endfor %}
    {% endif %}
    <div class="container">
        <div class="row"><div class="col-sm-12">
        
<form class="form-group" method="post" style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif ; background-color: beige;">
    <h4 style="text-align: center;background-color: #0a7286;color: beige;">Enquiry form</h4>
    {% csrf_token %}
    <table class="table table-bordered" style="margin: 50px;width: 50%; background-color: beige; ">
        <tr>
            <td>Enter Name</td>
            <td><input type="text" name="name"class="form-control"></td>
        </tr>
        <tr>
            <td>Enter Contact No</td>
            <td>
                <input type="number" name="contactno" class="form-control">
            </td>
        </tr><tr>
        <td>Enter Email address</td>
        <td>
            <input type="email" name="emailaddress" class="form-control">
        </td></tr>
        <tr>
            <td>Enter Enquiry Text</td>
            <td>
                <textarea name="enquirytext" class="form-control"></textarea>
            </td>

        </tr>
        <tr>
            <td></td>
            <td>
                <button type="submit" class="btn btn-success">Submit</button>
            </td>
        </tr>
    </table>
</form>
</div>

<div class="row">
<div class="col-sm-12">
   <h1 >Get connect with us</h1> 
</div>
</div>
</div>

   

</body>
</html>

{% endblock %}
