{% extends 'base.html' %}
{% load static %}

{% block title %}Login — Galaxy Resources{% endblock %}

{% block extra_css %}
<style>
  .login-wrapper {
    background: linear-gradient(135deg, #0b7c92, #0a7286);
    color: white;
    padding: 28px 24px;
    border-radius: 16px;
    box-shadow: 0 0 18px rgba(8, 111, 163, 0.35);
    animation: slideDown 0.6s ease forwards;
  }

  .login-card {
    background-color: #0b6b7f;
    border: 1px solid rgba(245, 245, 220, 0.25);
    border-radius: 12px;
    padding: 24px 20px;
  }
</style>
{% endblock %}

{% block main %}
<div class="container py-4 py-md-5">
  {% if messages %}
    {% for m in messages %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      {{m}}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
  {% endif %}

  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
      <div class="login-wrapper">
        <h1 class="h2 text-center mb-4">Login Page</h1>
        <div class="login-card">
          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_username" class="form-label fw-semibold">Login id:</label>
              <input id="id_username" type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
              <label for="id_password" class="form-label fw-semibold">Password:</label>
              <input id="id_password" type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="w-100 btn fw-semibold" style="background-color: beige; color: #0b6b7f;">
              Login
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
